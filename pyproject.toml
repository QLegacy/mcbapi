[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "margybot"
version = "0.1.0"
description = "Async aiogram-style library for Margy Chat bots (chat.narez.xyz) with SOCKS/HTTP proxy support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
]

[tool.setuptools]
packages = ["margybot"]
